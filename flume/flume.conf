agent.sources = source1
agent.channels = channel1
agent.sinks = sink1

agent.sources.source1.type = TAILDIR
agent.sources.source1.positionFile = /state/taildir_position.json
agent.sources.source1.filegroups = group1
agent.sources.source1.filegroups.group1 = /data/events.jsonl
agent.sources.source1.channels = channel1

agent.channels.channel1.type = file
agent.channels.channel1.checkpointDir = /state/checkpoint
agent.channels.channel1.dataDirs = /state/data

agent.sinks.sink1.type = hdfs
agent.sinks.sink1.channel = channel1
agent.sinks.sink1.hdfs.path = hdfs://namenode:8020/ecommerce/raw/year=%Y/month=%m/day=%d/hour=%H
agent.sinks.sink1.hdfs.filePrefix = events-
agent.sinks.sink1.hdfs.fileType = DataStream
agent.sinks.sink1.hdfs.writeFormat = Text
agent.sinks.sink1.hdfs.rollInterval = 60
agent.sinks.sink1.hdfs.rollSize = 0
agent.sinks.sink1.hdfs.rollCount = 0
agent.sinks.sink1.hdfs.useLocalTimeStamp = true
