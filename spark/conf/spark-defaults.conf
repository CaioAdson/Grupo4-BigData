spark.sql.warehouse.dir hdfs://namenode:8020/user/hive/warehouse

# CORREÇÃO: etl.py usa enableHiveSupport() sem um Hive Metastore dedicado,
# então o Spark cai no metastore embutido (Derby), que por padrão cria
# metastore_db/ e derby.log no diretório de trabalho atual. Os volumes
# ./spark:/opt/spark/jobs:ro e ./spark/conf:/opt/spark/conf:ro são somente
# leitura, então rodar spark-submit de dentro de /opt/spark/jobs falharia
# com "Permission denied". As linhas abaixo forçam o Derby a escrever em
# /tmp, que é gravável em qualquer container Spark.
spark.driver.extraJavaOptions -Dderby.system.home=/tmp/derby
spark.executor.extraJavaOptions -Dderby.system.home=/tmp/derby